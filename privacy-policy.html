<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>개인정보처리방침</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Malgun Gothic", sans-serif;
      line-height: 1.7; color: #1a1c18; background: #fbf5e9;
      margin: 0; padding: 24px 16px 64px;
    }
    main { max-width: 760px; margin: 0 auto; background: #fffdf6;
      border-radius: 16px; padding: 28px 24px; box-shadow: 0 1px 6px rgba(0,0,0,.06); }
    h1 { font-size: 1.6rem; margin: 0 0 4px; color: #3e7d44; }
    h2 { font-size: 1.15rem; margin: 28px 0 8px; color: #2c5a31;
      border-top: 1px solid #e2e4d6; padding-top: 18px; }
    .meta { color: #5b6157; font-size: .9rem; margin-bottom: 8px; }
    ul { padding-left: 20px; } li { margin: 4px 0; }
    a { color: #3e7d44; }
    code { background: #eef0e6; padding: 1px 5px; border-radius: 5px; font-size: .9em; }
    .note { background: #f0f4ea; border-radius: 10px; padding: 12px 14px; font-size: .92rem; }
  </style>
</head>
<body>
<main id="content"></main>

<script>
/* ─────────────────────────────────────────────────────────────
   앱별 설정. 새 앱을 추가하려면 아래 APPS 객체에 블록 하나만 추가하세요.
   개인정보처리방침 URL 예: privacy-policy.html?app=petmap

   필드 설명
   - name           : 표시할 앱 이름 (예: '펫맵(PetMap)')
   - effectiveDate  : 시행일 (예: '2026년 6월 25일')
   - summary        : 앱 한 줄 소개 ("...서비스입니다." 형태)
   - contact        : 문의 이메일
   - collectsLocation : 위치 정보를 사용하면 true
   - collectsAds      : AdMob 등 광고를 사용하면 true
   - localData      : 기기 내부에 저장하는 데이터 설명 (예: '즐겨찾기 등 사용자의 설정')
                      기기 저장 데이터가 없으면 null 또는 생략
   - sdks           : 사용하는 제3자 SDK 목록 [{ name, role, url }]
                      없으면 [] 또는 생략
   - dataSource     : 공공데이터 등 데이터 출처 안내문 (없으면 null 또는 생략)
   ───────────────────────────────────────────────────────────── */
const APPS = {
  petmap: {
    name: "펫맵(PetMap)",
    effectiveDate: "2026년 6월 25일",
    summary: "반려동물 동반 가능 장소를 지도에서 찾아주는 서비스입니다.",
    contact: "kimdev0821@gmail.com",
    collectsLocation: true,
    collectsAds: true,
    localData: "즐겨찾기 등 사용자의 설정",
    sdks: [
      { name: "Google AdMob", role: "광고 제공",
        url: "https://policies.google.com/privacy" },
      { name: "NAVER 지도 SDK", role: "지도 표시 및 위치 기능",
        url: "https://www.navercorp.com/utils/policiesView?type=privacy" },
    ],
    dataSource: "본 앱의 장소 정보는 한국문화정보원 「전국 반려동물 동반 가능 문화시설」 공공데이터를 활용하여 제공됩니다.",
  },

  /* 새 앱 예시 (필요할 때 복사해서 채우세요)
  newapp: {
    name: "새앱(NewApp)",
    effectiveDate: "2026년 0월 0일",
    summary: "...서비스입니다.",
    contact: "kimdev0821@gmail.com",
    collectsLocation: false,
    collectsAds: true,
    localData: null,
    sdks: [
      { name: "Google AdMob", role: "광고 제공",
        url: "https://policies.google.com/privacy" },
    ],
    dataSource: null,
  },
  */
};

const DEFAULT_APP = "petmap";

/* ───────────── 렌더링 ───────────── */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render(app) {
  document.title = app.name + " 개인정보처리방침";

  const sdks = app.sdks || [];
  const parts = [];

  parts.push(`<h1>${esc(app.name)} 개인정보처리방침</h1>`);
  parts.push(`<p class="meta">시행일: ${esc(app.effectiveDate)}</p>`);

  parts.push(`<p>${esc(app.name.replace(/\(.*\)/, "").trim())}(이하 "앱")은 ${esc(app.summary)}
    본 앱은 별도의 회원가입이나 로그인이 없으며, 이름·연락처·이메일 등 개인을 직접 식별하는
    정보를 수집하지 않습니다. 본 방침은 앱이 어떤 정보를 어떻게 다루는지 설명합니다.</p>`);

  /* 1. 수집·이용하는 정보 */
  parts.push(`<h2>1. 수집·이용하는 정보</h2>`);
  const items = [];
  if (app.collectsLocation) {
    items.push(`<li><strong>위치 정보</strong> (선택): 사용자가 위치 권한을 허용한 경우에 한해, 현재 위치 기준
      주변 장소 검색·거리 표시·지도상 내 위치 표시에 사용됩니다. 위치 정보는 기기에서 실시간으로
      이용되며 앱 운영자의 서버에 저장·전송되지 않습니다. 권한을 거부해도 위치 기반 기능만
      제한될 뿐 앱의 다른 기능은 정상 이용할 수 있습니다.</li>`);
  }
  if (app.collectsAds) {
    items.push(`<li><strong>광고 식별자(AAID) 등 광고 관련 정보</strong>: 앱 내 광고 제공·측정을 위해
      Google AdMob SDK가 광고 식별자와 기기·이용 정보를 수집·이용할 수 있습니다.</li>`);
  }
  if (app.localData) {
    items.push(`<li><strong>기기 내 저장 데이터</strong>: ${esc(app.localData)}은(는) 기기 내부 저장소에만
      저장되며 외부로 전송되지 않습니다. 앱을 삭제하면 함께 삭제됩니다.</li>`);
  }
  if (items.length) parts.push(`<ul>${items.join("")}</ul>`);
  parts.push(`<p>본 앱은 자체 서버를 운영하지 않으며, 위 정보 외의 개인정보를 별도로 수집·보관하지 않습니다.</p>`);

  /* 2. 제3자 SDK */
  if (sdks.length) {
    parts.push(`<h2>2. 제3자 SDK 및 처리위탁</h2>`);
    parts.push(`<p>앱은 아래 제3자 서비스를 이용하며, 해당 서비스의 정보 처리는 각 사의 개인정보처리방침을 따릅니다.</p>`);
    parts.push(`<ul>${sdks.map(s =>
      `<li><strong>${esc(s.name)}</strong> (${esc(s.role)}) —
        <a href="${esc(s.url)}" target="_blank" rel="noopener">개인정보처리방침</a></li>`
    ).join("")}</ul>`);
  }

  /* 3. 보유 및 파기 */
  parts.push(`<h2>3. 보유 및 파기</h2>`);
  let keepText = "앱 운영자는 개인정보를 서버에 수집·보관하지 않습니다.";
  if (app.localData) keepText += " 기기 내 저장 데이터는 앱 삭제 시 모두 파기됩니다.";
  if (app.collectsLocation) keepText += " 위치 정보는 저장하지 않고 이용 즉시 폐기됩니다.";
  parts.push(`<p>${keepText}</p>`);

  /* 4. 이용자의 권리 */
  const rights = [];
  if (app.collectsLocation) {
    rights.push(`<li>위치 권한은 기기의 [설정 &gt; 앱 &gt; 권한]에서 언제든 허용/철회할 수 있습니다.</li>`);
  }
  if (app.collectsAds) {
    rights.push(`<li>맞춤형 광고는 기기의 [설정 &gt; Google &gt; 광고]에서 광고 ID 재설정 또는
      맞춤 광고 사용 중지로 조정할 수 있습니다.</li>`);
  }
  if (rights.length) {
    parts.push(`<h2>4. 이용자의 권리</h2>`);
    parts.push(`<ul>${rights.join("")}</ul>`);
  }

  /* 5. 아동 / 6. 변경 / 7. 문의처 */
  parts.push(`<h2>5. 아동의 개인정보</h2>`);
  parts.push(`<p>본 앱은 만 14세 미만 아동을 주 대상으로 하지 않으며, 아동의 개인정보를 고의로 수집하지 않습니다.</p>`);

  parts.push(`<h2>6. 방침의 변경</h2>`);
  parts.push(`<p>본 개인정보처리방침은 법령 또는 서비스 변경에 따라 개정될 수 있으며, 변경 시 본 페이지를 통해 공지합니다.</p>`);

  parts.push(`<h2>7. 문의처</h2>`);
  parts.push(`<p>개인정보 관련 문의: <a href="mailto:${esc(app.contact)}">${esc(app.contact)}</a></p>`);

  /* 데이터 출처 (선택) */
  if (app.dataSource) {
    parts.push(`<h2>데이터 출처</h2>`);
    parts.push(`<p class="note">${esc(app.dataSource)}</p>`);
  }

  document.getElementById("content").innerHTML = parts.join("\n");
}

/* ───────────── 진입점 ───────────── */
(function () {
  const key = new URLSearchParams(location.search).get("app") || DEFAULT_APP;
  const app = APPS[key];
  if (!app) {
    document.getElementById("content").innerHTML =
      `<h1>개인정보처리방침</h1><p class="note">요청하신 앱(<code>${esc(key)}</code>)의 개인정보처리방침을 찾을 수 없습니다.</p>`;
    document.title = "개인정보처리방침";
    return;
  }
  render(app);
})();
</script>
</body>
</html>
